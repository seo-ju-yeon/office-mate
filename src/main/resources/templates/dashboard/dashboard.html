<!DOCTYPE html>
<html lang="ko"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<th:block layout:fragment="head-extra">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>OfficeMate - 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" th:href="@{/css/dashboard/dashboard.css}">
</th:block>

<div layout:fragment="content" class="dashboard-container">
    <div class="welcome-msg">
        <h1 style="margin:0; font-size: 24px;">안녕하세요, <span id="welcome-name">-</span>님!</h1>
        <p style="color: #6B778C;">오늘도 활기찬 하루 되세요.</p>
    </div>

    <div class="summary-grid">
        <div class="dashboard-card card-stat-progress">
            <div class="card-title">진행 중인 업무</div>
            <div class="card-value">
                <span id="stat-in-progress">0</span>
                <i data-lucide="play-circle" style="color:#0052CC"></i>
            </div>
        </div>
        <div class="dashboard-card card-stat-today">
            <div class="card-title">오늘 마감 업무</div>
            <div class="card-value">
                <span id="stat-due-today">0</span>
                <i data-lucide="calendar-check" style="color:#FFAB00"></i>
            </div>
        </div>
        <div class="dashboard-card card-stat-overdue">
            <div class="card-title">지연된 업무</div>
            <div class="card-value">
                <span id="stat-overdue">0</span>
                <i data-lucide="alert-circle" style="color:#DE350B"></i>
            </div>
        </div>
    </div>

    <div class="dashboard-row">
        <div class="dashboard-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 style="margin:0 0 15px 0;">최근 공지사항</h3>
                <a href="/board/notice/list" style="font-size:12px; color:#0052CC; text-decoration:none;">전체보기
                    &rsaquo;</a>
            </div>
            <table class="list-table">
                <thead>
                <tr>
                    <th style="width:70px; padding-left:10px; padding-right:4px;">게시판</th>
                    <th>제목</th>
                    <th style="width:100px;">작성자</th>
                    <th style="width:100px;">날짜</th>
                </tr>
                </thead>
                <tbody id="notice-list"></tbody>
            </table>
        </div>

        <div class="dashboard-card">
            <h3 style="margin:0 0 15px 0;">내 업무 현황</h3>
            <div id="assigned-task-list">
                <p style="color:#6B778C; font-size:14px;">업무를 불러오는 중입니다...</p>
            </div>
        </div>
    </div>

    <div class="modal fade" id="notificationModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-primary text-white border-0">
                    <h5 class="modal-title fw-bold">
                        <i data-lucide="megaphone" class="me-2" style="width:20px; height:20px;"></i>새 업무 배정 알림
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                            aria-label="Close"></button>
                </div>
                <div class="modal-body p-5 text-center">
                    <div class="mb-4 d-inline-flex align-items-center justify-content-center bg-light rounded-circle"
                         style="width: 80px; height: 80px;">
                        <i data-lucide="clipboard-check" class="text-primary" style="width: 40px; height: 40px;"></i>
                    </div>
                    <h5 id="noti-title" class="fw-bold mb-3 text-dark">업무 제목</h5>
                    <p id="noti-message" class="text-muted mb-0 lh-base">업무 상세 내용이 표시됩니다.</p>
                </div>
                <div class="modal-footer border-0 p-3">
                    <button type="button" id="confirmNotiBtn" class="btn btn-primary w-100 py-3 fw-bold shadow-sm">
                        확인했습니다
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block layout:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/dashboard/dashboard.js}"></script>
</th:block>
</html>
