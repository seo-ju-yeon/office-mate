<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<th:block layout:fragment="head-extra">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/calendar/calendar.css}">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

<div layout:fragment="content">
    <div class="content-header mb-4">
        <h2>일정 관리</h2>
    </div>

    <div id="project-filter-container">
        <div class="project-filter-title">
            <i data-lucide="layers" style="width:16px;"></i> 참여 중인 프로젝트 업무 보기
        </div>
        <div id="project-filter-list" class="d-flex flex-wrap gap-3">
            <small class="text-muted">참여 중인 프로젝트를 불러오는 중...</small>
        </div>
    </div>

    <div id="calendar-container">
        <div id='calendar'></div>
    </div>

    <div id="event-list-container">
        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
            <div>
                <h5 class="m-0 d-inline-block" id="list-title">이달의 개인 일정</h5>
                <span class="badge bg-primary" id="event-count">0건</span>
            </div>
            <button type="button" class="btn btn-sm btn-success" onclick="exportAllToGoogle()">
                <i data-lucide="share-2" style="width:14px; margin-right:4px;"></i> 구글로 전체 내보내기
            </button>
        </div>
        <div id="event-list-content"></div>
    </div>

    <div class="modal fade" id="eventModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">일정 상세</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="eventId">

                    <div id="projectTaskInfo" class="alert alert-info" style="display: none;">
                        <div class="mb-1"><strong>상태:</strong> <span id="taskStatus">-</span></div>
                        <div><strong>진척률:</strong> <span id="taskProgress">0</span>%</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">제목</label>
                        <input type="text" id="eventTitle" class="form-control">
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label">시작 일시</label>
                            <input type="datetime-local" id="eventStart" class="form-control">
                        </div>
                        <div class="col">
                            <label class="form-label">종료 일시</label>
                            <input type="datetime-local" id="eventEnd" class="form-control">
                        </div>
                    </div>

                    <div class="mb-3" id="colorSelectGroup">
                        <label class="form-label d-block">색상</label>
                        <input type="hidden" id="eventColor" value="9">
                        <div id="colorPickerContainer" class="d-flex flex-wrap gap-2 pt-1"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">설명</label>
                        <textarea id="eventDescription" class="form-control" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger me-auto" id="btnDelete" onclick="deleteEvent()">삭제</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" id="btnSave" onclick="saveEvent()">저장</button>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/calendar/calendar.js}"></script>
</th:block>
</html>
