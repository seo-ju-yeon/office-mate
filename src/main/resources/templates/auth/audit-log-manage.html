<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<th:block layout:fragment="head-extra">
    <title>OfficeMate - 감사 로그 관리</title>
    <link rel="stylesheet" th:href="@{/css/auth/audit-log-manage.css}">
</th:block>

<div layout:fragment="content" class="audit-log-container">
    <!-- 페이지 제목 및 CSV 내보내기 영역 -->
    <div class="audit-page-header">
        <h1 class="audit-page-title">감사 로그 조회</h1>
        <button class="audit-button secondary" type="button" onclick="exportAuditCsv()">CSV 내보내기</button>
    </div>

    <!-- 감사 로그 조회 조건 필터 영역 -->
    <div class="audit-filter-card">
        <div class="audit-filter-group">
            <label for="auditStartDate">조회 시작일</label>
            <input type="date" id="auditStartDate" value="2026-04-27">
        </div>

        <div class="audit-filter-group">
            <label for="auditAction">액션 타입</label>
            <select id="auditAction">
                <option value="">전체</option>
                <option value="CREATE">CREATE</option>
                <option value="READ">READ</option>
                <option value="UPDATE">UPDATE</option>
                <option value="DELETE">DELETE</option>
                <option value="LOGIN">LOGIN</option>
                <option value="LOGOUT">LOGOUT</option>
                <option value="PERMISSION_CHANGE">PERMISSION_CHANGE</option>
                <option value="AI_REQUEST">AI_REQUEST</option>
                <option value="EXPORT">EXPORT</option>
            </select>
        </div>

        <div class="audit-filter-group">
            <label for="auditActorNo">행위자 사번</label>
            <input type="text" id="auditActorNo" placeholder="사번 입력">
        </div>

        <div class="audit-filter-group">
            <label for="auditResult">결과</label>
            <select id="auditResult">
                <option value="">전체</option>
                <option value="SUCCESS">SUCCESS</option>
                <option value="FAIL">FAIL</option>
            </select>
        </div>

        <button class="audit-button" type="button" onclick="loadAuditLogs(0)">필터 적용</button>
    </div>

    <!-- 감사 로그 목록 및 페이지 이동 영역 -->
    <div class="audit-table-wrapper">
        <table class="audit-table">
            <thead>
            <tr>
                <th>타임스탬프</th>
                <th>행위자</th>
                <th>액션</th>
                <th>리소스</th>
                <th>ID</th>
                <th>IP 주소</th>
                <th>결과</th>
            </tr>
            </thead>
            <tbody id="auditLogTableBody">
            <tr>
                <td class="audit-empty-row" colspan="7">감사 로그를 불러오는 중입니다.</td>
            </tr>
            </tbody>
        </table>

        <div class="audit-pagination">
            <button class="audit-button secondary" type="button" onclick="moveAuditPage(-1)">이전</button>
            <span class="audit-page-info" id="auditPageInfo">0 / 0</span>
            <button class="audit-button secondary" type="button" onclick="moveAuditPage(1)">다음</button>
        </div>
    </div>

    <!-- 감사 로그 상세 모달 영역 -->
    <div id="auditLogModal" class="audit-modal">
        <div class="audit-modal-content">
            <div class="audit-modal-header">
                <h2 class="audit-modal-title">로그 상세 정보 (ID: <span id="auditDetailId">1</span>)</h2>
                <button class="audit-modal-close" type="button" onclick="closeAuditLogModal()">&times;</button>
            </div>

            <div class="audit-modal-body">
                <div>
                    <label class="audit-json-label">요청 정보</label>
                    <div class="audit-json-view" id="auditRequestJson">{}</div>
                </div>

                <div>
                    <label class="audit-json-label">처리 정보</label>
                    <div class="audit-json-view audit-result-json" id="auditResultJson">{}</div>
                </div>
            </div>

            <div class="audit-modal-footer">
                <button class="audit-button secondary" type="button" onclick="closeAuditLogModal()">닫기</button>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/auth/audit-log-manage.js}"></script>
</th:block>
</html>
