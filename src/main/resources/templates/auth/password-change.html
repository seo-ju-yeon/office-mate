<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>OfficeMate - 비밀번호 변경</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth/password-change.css}">
</head>
<body>
<!-- 임시 비밀번호 사용자 비밀번호 변경 본문 영역 -->
<div class="container">
    <!-- 비밀번호 변경 필요 안내 영역 -->
    <div class="alert-banner">
        <strong>임시 비밀번호를 사용 중입니다.</strong><br>
        보안을 위해 비밀번호를 변경해야 서비스를 이용할 수 있습니다.
    </div>

    <!-- 비밀번호 변경 오류 메시지 영역 -->
    <div id="error-msg" class="error-area"></div>

    <!-- 비밀번호 변경 입력 폼 영역 -->
    <form id="pwForm">
        <div class="form-group">
            <label>현재 비밀번호</label>
            <input type="password" id="currPw" required>
        </div>

        <div class="form-group">
            <label>새 비밀번호</label>
            <input type="password" id="newPw" required>
            <ul class="policy-list">
                <li id="p-length" class="policy-item fail">8자 이상</li>
                <li id="p-alpha" class="policy-item fail">영문 포함</li>
                <li id="p-number" class="policy-item fail">숫자 포함</li>
                <li id="p-special" class="policy-item fail">특수문자 포함</li>
            </ul>
        </div>

        <div class="form-group">
            <label>새 비밀번호 확인</label>
            <input type="password" id="confirmPw" required>
            <div id="match-msg" class="match-message"></div>
        </div>

        <!-- 변경 요청 감사 로그에 사용할 action/resource 값 포함 -->
        <button type="submit" id="submitBtn" class="btn-submit" disabled data-action="UPDATE" data-resource="PASSWORD">
            비밀번호 변경
        </button>
        <a href="/login" class="logout-link" onclick="logoutAndMoveToLogin(event)">로그아웃 후 다시 로그인</a>
    </form>
</div>

<script th:src="@{/js/auth/password-change.js}"></script>
</body>
</html>
