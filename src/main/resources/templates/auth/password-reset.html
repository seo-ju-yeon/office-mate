<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>OfficeMate - 비밀번호 재설정</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth/password-reset.css}">
</head>
<body>
<!-- 임시 비밀번호와 새 비밀번호를 입력해 비밀번호를 재설정하는 화면 -->
<div class="container">
    <h2>비밀번호 재설정</h2>
    <p class="description">
        메일로 받은 임시 비밀번호와 새 비밀번호를 입력해 주세요.<br>
        임시 비밀번호는 발급 후 10분 동안만 사용할 수 있습니다.
    </p>

    <!-- 비밀번호 재설정 성공/실패 메시지를 표시하는 영역 -->
    <div id="message-area" class="message-area"></div>

    <!-- 사번, 임시 비밀번호, 새 비밀번호를 입력받아 재설정 요청을 보내는 폼 -->
    <form id="reset-form">
        <div class="form-group">
            <label>사번</label>
            <input type="text" id="employee-no" required placeholder="예: MS001">
        </div>

        <div class="form-group">
            <label>메일로 받은 임시 비밀번호</label>
            <input type="password" id="temp-password" required>
        </div>

        <div class="form-group">
            <label>새 비밀번호</label>
            <input type="password" id="new-password" required>
            <ul class="policy-list">
                <li id="p-length" class="policy-item fail">8자 이상</li>
                <li id="p-alpha" class="policy-item fail">영문 포함</li>
                <li id="p-number" class="policy-item fail">숫자 포함</li>
                <li id="p-special" class="policy-item fail">특수문자 포함</li>
            </ul>
        </div>

        <div class="form-group">
            <label>새 비밀번호 확인</label>
            <input type="password" id="confirm-password" required>
            <div id="match-msg" class="match-message"></div>
        </div>

        <button type="submit" id="submit-btn" class="btn-submit" disabled>비밀번호 재설정</button>
    </form>

    <!-- 임시 비밀번호 재발급과 로그인 화면 이동 링크 영역 -->
    <div class="link-area">
        <a href="/password-find">임시 비밀번호 다시 받기</a>
        <a href="/login">로그인으로 돌아가기</a>
    </div>
</div>

<script th:src="@{/js/auth/password-reset.js}"></script>
</body>
</html>
