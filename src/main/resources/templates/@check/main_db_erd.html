<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>main_db ERD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            background: #0d0f14;
            color: #c8cfe8;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column
        }

        header {
            background: rgba(13, 15, 20, .95);
            border-bottom: 1px solid #1e2436;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            z-index: 10
        }

        .badge {
            font-size: 10px;
            font-weight: 600;
            background: linear-gradient(135deg, #4f7cff, #7c5cfc);
            color: #fff;
            padding: 3px 9px;
            border-radius: 4px;
            letter-spacing: .05em
        }

        header h1 {
            font-size: 13px;
            color: #c8cfe8
        }

        .sub {
            font-size: 11px;
            color: #4a5270;
            margin-left: auto
        }

        .toolbar {
            background: #0d0f14;
            border-bottom: 1px solid #1e2436;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0
        }

        .tl {
            font-size: 10px;
            color: #4a5270;
            margin-right: 4px
        }

        .btn {
            font-size: 10px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 5px;
            border: 1px solid #1e2436;
            background: #13161e;
            color: #c8cfe8;
            cursor: pointer;
            transition: all .15s;
            letter-spacing: .03em
        }

        .btn:hover {
            border-color: #4f7cff;
            color: #4f7cff
        }

        #zoom-val {
            font-size: 10px;
            color: #4a5270;
            min-width: 34px;
            text-align: center
        }

        .canvas-wrap {
            flex: 1;
            overflow: hidden;
            position: relative;
            cursor: grab
        }

        .canvas-wrap:active {
            cursor: grabbing
        }

        svg#erd {
            position: absolute;
            top: 0;
            left: 0
        }

        .legend {
            background: #0d0f14;
            border-top: 1px solid #1e2436;
            padding: 8px 20px;
            display: flex;
            gap: 18px;
            flex-shrink: 0;
            flex-wrap: wrap
        }

        .li {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: #4a5270
        }

        .ld {
            width: 8px;
            height: 8px;
            border-radius: 2px
        }

        /* SVG table styles */
        .tbl-header {
            fill: #1a1e2a
        }

        .tbl-bg-odd {
            fill: #13161e
        }

        .tbl-bg-even {
            fill: #0f1118
        }

        .tbl-border {
            stroke: #2e3650;
            stroke-width: .8;
            fill: none
        }

        .tbl-title {
            fill: #e2e8ff;
            font-size: 11px;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace
        }

        .col-name {
            fill: #94a3c8;
            font-size: 9.5px;
            font-family: 'JetBrains Mono', monospace
        }

        .col-type {
            fill: #4a5270;
            font-size: 9px;
            font-family: 'JetBrains Mono', monospace
        }

        .pk-badge {
            fill: #4f7cff;
            font-size: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600
        }

        .fk-badge {
            fill: #7c5cfc;
            font-size: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600
        }

        .pkfk-badge {
            fill: #3ecf8e;
            font-size: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600
        }

        .rel-line {
            stroke: #2e4070;
            stroke-width: 1;
            fill: none;
            opacity: .7
        }

        .rel-label {
            fill: #2e4070;
            font-size: 8px;
            font-family: 'JetBrains Mono', monospace
        }
    </style>
</head>
<body>
<header>
    <span class="badge">ERD</span>
    <h1>main_db 스키마</h1>
    <span class="sub">20 tables · PostgreSQL · main_db</span>
</header>
<div class="toolbar">
    <span class="tl">ZOOM</span>
    <button class="btn" onclick="zoomBy(-0.15)">−</button>
    <span id="zoom-val">100%</span>
    <button class="btn" onclick="zoomBy(0.15)">+</button>
    <button class="btn" onclick="resetView()">RESET</button>
    <span style="flex:1"></span>
    <span class="tl">드래그로 이동 · 휠로 확대/축소</span>
</div>
<div class="canvas-wrap" id="wrap">
    <svg id="erd" xmlns="http://www.w3.org/2000/svg"></svg>
</div>
<div class="legend">
    <div class="li">
        <div class="ld" style="background:#4f7cff"></div>
        PK
    </div>
    <div class="li">
        <div class="ld" style="background:#7c5cfc"></div>
        FK
    </div>
    <div class="li">
        <div class="ld" style="background:#3ecf8e"></div>
        PK+FK
    </div>
    <div class="li">
        <div class="ld" style="background:#2e4070;width:24px;height:2px;border-radius:1px"></div>
        관계선
    </div>
</div>

<script>
    const ROW_H = 18, HDR_H = 26, PAD = 10, TBL_W = 210;

    const tables = [
        {
            id: 'departments', x: 40, y: 40, cols: [
                {n: 'code', t: 'department_code', k: 'PK'},

                {n: 'department', t: 'department_code', k: 'FK'},

                {n: 'author_no', t: 'varchar(30)', k: 'FK'},
                {n: 'content', t: 'varchar(200)', k: ''},
                {n: 'posted_at', t: 'timestamptz', k: ''},
                {n: 'deleted_at', t: 'timestamptz', k: ''},
            ]
        },
        {
            id: 'google_calendar_link', x: 880, y: 40, cols: [
                {n: 'employee_no', t: 'varchar(30)', k: 'PK+FK'},
                {n: 'google_calendar_id', t: 'varchar(255)', k: ''},
                {n: 'access_token_encrypted', t: 'text', k: ''},
                {n: 'refresh_token_encrypted', t: 'text', k: ''},
                {n: 'token_expires_at', t: 'timestamptz', k: ''},
            ]
        },
        {
            id: 'calendar_event', x: 880, y: 210, cols: [
                {n: 'id', t: 'bigserial', k: 'PK'},
                {n: 'parent_id', t: 'bigint', k: 'FK'},
                {n: 'owner_no', t: 'varchar(30)', k: 'FK'},
                {n: 'department', t: 'department_code', k: 'FK'},
                {n: 'project_id', t: 'bigint', k: 'FK'},
                {n: 'created_by', t: 'varchar(30)', k: 'FK'},
                {n: 'title', t: 'varchar(200)', k: ''},
                {n: 'description', t: 'text', k: ''},
                {n: 'starts_at', t: 'timestamptz', k: ''},
                {n: 'ends_at', t: 'timestamptz', k: ''},
                {n: 'is_all_day', t: 'boolean', k: ''},
                {n: 'scope', t: 'calendar_scope', k: ''},
            ]
        },
        {
            id: 'chat_room', x: 880, y: 490, cols: [
                {n: 'id', t: 'bigserial', k: 'PK'},
                {n: 'name', t: 'varchar(100)', k: ''},

            ]
        },
        {
            id: 'chat_room_member', x: 880, y: 620, cols: [
                {n: 'room_id', t: 'bigint', k: 'PK+FK'},
                {n: 'employee_no', t: 'varchar(30)', k: 'PK+FK'},
                {n: 'joined_at', t: 'timestamptz', k: ''},

            ]
        },
        {
            id: 'chat_message', x: 880, y: 770, cols: [
                {n: 'id', t: 'bigserial', k: 'PK'},
                {n: 'room_id', t: 'bigint', k: 'FK'},
                {n: 'sender_no', t: 'varchar(30)', k: 'FK'},
                {n: 'content', t: 'text', k: ''},
                {n: 'message_type', t: 'varchar(20)', k: ''},
                {n: 'sent_at', t: 'timestamptz', k: ''},
            ]
        },
        {
            id: 'project', x: 1160, y: 40, cols: [
                {n: 'id', t: 'bigserial', k: 'PK'},
                {n: 'name', t: 'varchar(150)', k: ''},
                {n: 'description', t: 'text', k: ''},
                {n: 'owner_department', t: 'department_code', k: 'FK'},
                {n: 'manager_no', t: 'varchar(30)', k: 'FK'},
                {n: 'status', t: 'project_status', k: ''},
                {n: 'progress_rate', t: 'smallint', k: ''},
                {n: 'starts_on', t: 'date', k: ''},
                {n: 'ends_on', t: 'date', k: ''},
            ]
        },
        {
            id: 'project_member', x: 1160, y: 290, cols: [
                {n: 'project_id', t: 'bigint', k: 'PK+FK'},
                {n: 'employee_no', t: 'varchar(30)', k: 'PK+FK'},
                {n: 'joined_at', t: 'timestamptz', k: ''},
            ]
        },
        {
            id: 'project_task', x: 1160, y: 420, cols: [
                {n: 'id', t: 'bigserial', k: 'PK'},
                {n: 'project_id', t: 'bigint', k: 'FK'},
                {n: 'assignee_no', t: 'varchar(30)', k: 'FK'},
                {n: 'title', t: 'varchar(200)', k: ''},
                {n: 'description', t: 'text', k: ''},
                {n: 'status', t: 'task_status', k: ''},
                {n: 'progress_rate', t: 'smallint', k: ''},
                {n: 'priority', t: 'varchar(20)', k: ''},
                {n: 'assigned_by', t: 'varchar(30)', k: 'FK'},
                {n: 'due_on', t: 'date', k: ''},
                {n: 'is_critical', t: 'boolean', k: ''},
                {n: 'completed_at', t: 'timestamptz', k: ''},
            ]
        },
        {
            id: 'notification', x: 1160, y: 700, cols: [
                {n: 'id', t: 'bigserial', k: 'PK'},
                {n: 'employee_no', t: 'varchar(30)', k: 'FK'},
                {n: 'title', t: 'varchar(200)', k: ''},
                {n: 'message', t: 'text', k: ''},
                {n: 'ref_type', t: 'notification_ref_type', k: ''},
                {n: 'ref_id', t: 'varchar(80)', k: ''},
                {n: 'is_read', t: 'boolean', k: ''},
                {n: 'created_at', t: 'timestamptz', k: ''},
            ]
        },
        {
            id: 'ai_knowledge', x: 1440, y: 40, cols: [
                {n: 'id', t: 'bigserial', k: 'PK'},
                {n: 'document_type', t: 'ai_document_type', k: ''},
                {n: 'source_table', t: 'varchar(60)', k: ''},
                {n: 'source_id', t: 'varchar(80)', k: ''},
                {n: 'title', t: 'varchar(200)', k: ''},
                {n: 'chunk_text', t: 'text', k: ''},
                {n: 'embedding_model', t: 'varchar(80)', k: ''},
                {n: 'indexed_at', t: 'timestamptz', k: ''},
            ]
        },
        {
            id: 'refresh_token', x: 1440, y: 280, cols: [
                {n: 'id', t: 'bigserial', k: 'PK'},
                {n: 'employee_no', t: 'varchar(30)', k: 'FK'},
                {n: 'token_hash', t: 'varchar(255)', k: ''},
                {n: 'expires_at', t: 'timestamptz', k: ''},
                {n: 'revoked_at', t: 'timestamptz', k: ''},
            ]
        },
    ];

    const relations = [
        ['departments', 'employee', '1:N'],
        ['departments', 'project', '1:N'],
        ['departments', 'calendar_event', '1:N'],
        ['roles', 'role_permissions', '1:N'],
        ['roles', 'employee', '1:N'],
        ['roles', 'employee_roles', '1:N'],
        ['permissions', 'role_permissions', '1:N'],
        ['employee', 'employee_roles', '1:N'],
        ['employee', 'post', '1:N'],
        ['employee', 'post_comment', '1:N'],
        ['employee', 'project', '1:N'],
        ['employee', 'project_member', '1:N'],
        ['employee', 'project_task', '1:N'],
        ['employee', 'chat_room_member', '1:N'],
        ['employee', 'chat_message', '1:N'],
        ['employee', 'calendar_event', '1:N'],
        ['employee', 'google_calendar_link', '1:1'],
        ['employee', 'notification', '1:N'],
        ['employee', 'refresh_token', '1:N'],
        ['board', 'post', '1:N'],
        ['post', 'post_attachment', '1:N'],
        ['post', 'post_comment', '1:N'],
        ['chat_room', 'chat_room_member', '1:N'],
        ['chat_room', 'chat_message', '1:N'],
        ['project', 'project_member', '1:N'],
        ['project', 'project_task', '1:N'],
        ['project', 'calendar_event', '1:N'],
    ];

    // Build table index
    const tblMap = {};
    tables.forEach(t => {
        tblMap[t.id] = t;
    });

    function tblHeight(t) {
        return HDR_H + t.cols.length * ROW_H;
    }

    function tblRight(t) {
        return t.x + TBL_W;
    }

    function tblBottom(t) {
        return t.y + tblHeight(t);
    }

    function tblCenterY(t) {
        return t.y + tblHeight(t) / 2;
    }

    function tblCenterX(t) {
        return t.x + TBL_W / 2;
    }

    const svg = document.getElementById('erd');
    const wrap = document.getElementById('wrap');

    // compute canvas size
    let maxX = 0, maxY = 0;
    tables.forEach(t => {
        maxX = Math.max(maxX, tblRight(t) + 60);
        maxY = Math.max(maxY, tblBottom(t) + 60);
    });
    svg.setAttribute('width', maxX);
    svg.setAttribute('height', maxY);
    svg.setAttribute('viewBox', `0 0 ${maxX} ${maxY}`);

    // Draw relations first (behind tables)
    const relG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    relations.forEach(([from, to, type]) => {
        const a = tblMap[from], b = tblMap[to];
        if (!a || !b) return;

        // pick connection sides
        let x1, y1, x2, y2;
        const aRight = tblRight(a), bRight = tblRight(b);
        const aCX = tblCenterX(a), bCX = tblCenterX(b);
        const aCY = tblCenterY(a), bCY = tblCenterY(b);

        if (aRight <= b.x) {
            x1 = aRight;
            y1 = aCY;
            x2 = b.x;
            y2 = bCY;
        } else if (bRight <= a.x) {
            x1 = a.x;
            y1 = aCY;
            x2 = bRight;
            y2 = bCY;
        } else if (tblBottom(a) <= b.y) {
            x1 = aCX;
            y1 = tblBottom(a);
            x2 = bCX;
            y2 = b.y;
        } else {
            x1 = aCX;
            y1 = a.y;
            x2 = bCX;
            y2 = tblBottom(b);
        }

        const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const dx = Math.abs(x2 - x1) * 0.4;
        path.setAttribute('d', `M${x1},${y1} C${x1 + dx * Math.sign(x2 - x1)},${y1} ${x2 - dx * Math.sign(x2 - x1)},${y2} ${x2},${y2}`);
        path.setAttribute('class', 'rel-line');
        relG.appendChild(path);

        // label
        const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        lbl.setAttribute('x', mx);
        lbl.setAttribute('y', my - 3);
        lbl.setAttribute('text-anchor', 'middle');
        lbl.setAttribute('class', 'rel-label');
        lbl.textContent = type;
        relG.appendChild(lbl);
    });
    svg.appendChild(relG);

    // Draw tables
    tables.forEach(t => {
        const h = tblHeight(t);
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('transform', `translate(${t.x},${t.y})`);

        // shadow rect
        const shadow = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        shadow.setAttribute('x', '2');
        shadow.setAttribute('y', '2');
        shadow.setAttribute('width', TBL_W);
        shadow.setAttribute('height', h);
        shadow.setAttribute('rx', '6');
        shadow.setAttribute('fill', 'rgba(0,0,0,.4)');
        g.appendChild(shadow);

        // background
        const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        bg.setAttribute('width', TBL_W);
        bg.setAttribute('height', h);
        bg.setAttribute('rx', '6');
        bg.setAttribute('fill', '#13161e');
        g.appendChild(bg);

        // header
        const hdr = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        hdr.setAttribute('width', TBL_W);
        hdr.setAttribute('height', HDR_H);
        hdr.setAttribute('rx', '6');
        hdr.setAttribute('fill', '#1a1e2a');
        g.appendChild(hdr);
        // header bottom square
        const hdrBtm = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        hdrBtm.setAttribute('y', HDR_H - 6);
        hdrBtm.setAttribute('width', TBL_W);
        hdrBtm.setAttribute('height', '6');
        hdrBtm.setAttribute('fill', '#1a1e2a');
        g.appendChild(hdrBtm);

        // accent line
        const accent = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        accent.setAttribute('width', '3');
        accent.setAttribute('height', HDR_H);
        accent.setAttribute('rx', '0');
        accent.setAttribute('fill', '#4f7cff');
        g.appendChild(accent);
        // top-left round for accent
        const accentRnd = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        accentRnd.setAttribute('width', '3');
        accentRnd.setAttribute('height', HDR_H);
        accentRnd.setAttribute('fill', '#4f7cff');
        g.appendChild(accentRnd);

        // title
        const title = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        title.setAttribute('x', PAD + 4);
        title.setAttribute('y', HDR_H / 2 + 1);
        title.setAttribute('dominant-baseline', 'middle');
        title.setAttribute('class', 'tbl-title');
        title.textContent = t.id;
        g.appendChild(title);

        // rows
        t.cols.forEach((col, i) => {
            const ry = HDR_H + i * ROW_H;
            const rowbg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rowbg.setAttribute('y', ry);
            rowbg.setAttribute('width', TBL_W);
            rowbg.setAttribute('height', ROW_H);
            rowbg.setAttribute('fill', i % 2 === 0 ? '#0f1118' : '#111420');
            g.appendChild(rowbg);

            // badge
            if (col.k) {
                const bw = col.k === 'PK+FK' ? 30 : 14;
                const brect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                brect.setAttribute('x', PAD);
                brect.setAttribute('y', ry + 4);
                brect.setAttribute('width', bw);
                brect.setAttribute('height', 10);
                brect.setAttribute('rx', '2');
                brect.setAttribute('fill', col.k === 'PK' ? 'rgba(79,124,255,.25)' : col.k === 'FK' ? 'rgba(124,92,252,.25)' : 'rgba(62,207,142,.2)');
                g.appendChild(brect);

                const btxt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                btxt.setAttribute('x', PAD + bw / 2);
                btxt.setAttribute('y', ry + ROW_H / 2 + 1);
                btxt.setAttribute('text-anchor', 'middle');
                btxt.setAttribute('dominant-baseline', 'middle');
                btxt.setAttribute('class', col.k === 'PK' ? 'pk-badge' : col.k === 'FK' ? 'fk-badge' : 'pkfk-badge');
                btxt.textContent = col.k;
                g.appendChild(btxt);
            }

            // col name
            const cx = col.k ? PAD + (col.k === 'PK+FK' ? 36 : 20) : PAD + 4;
            const colname = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            colname.setAttribute('x', cx);
            colname.setAttribute('y', ry + ROW_H / 2 + 1);
            colname.setAttribute('dominant-baseline', 'middle');
            colname.setAttribute('class', 'col-name');
            colname.textContent = col.n;
            g.appendChild(colname);

            // col type
            const coltype = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            coltype.setAttribute('x', TBL_W - PAD);
            coltype.setAttribute('y', ry + ROW_H / 2 + 1);
            coltype.setAttribute('text-anchor', 'end');
            coltype.setAttribute('dominant-baseline', 'middle');
            coltype.setAttribute('class', 'col-type');
            coltype.textContent = col.t;
            g.appendChild(coltype);
        });

        // border
        const border = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        border.setAttribute('width', TBL_W);
        border.setAttribute('height', h);
        border.setAttribute('rx', '6');
        border.setAttribute('class', 'tbl-border');
        g.appendChild(border);

        svg.appendChild(g);
    });

    // Pan & zoom
    let scale = 1, ox = 0, oy = 0, dragging = false, lastX, lastY;

    wrap.addEventListener('mousedown', e => {
        dragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
    });
    window.addEventListener('mouseup', () => dragging = false);
    window.addEventListener('mousemove', e => {
        if (!dragging) return;
        ox += e.clientX - lastX;
        oy += e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
        applyTransform();
    });
    wrap.addEventListener('wheel', e => {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.1 : -0.1;
        scale = Math.max(0.2, Math.min(3, scale + delta));
        document.getElementById('zoom-val').textContent = Math.round(scale * 100) + '%';
        applyTransform();
    }, {passive: false});

    function applyTransform() {
        svg.style.transform = `translate(${ox}px,${oy}px) scale(${scale})`;
        svg.style.transformOrigin = '0 0';
    }

    window.zoomBy = function (d) {
        scale = Math.max(0.2, Math.min(3, scale + d));
        document.getElementById('zoom-val').textContent = Math.round(scale * 100) + '%';
        applyTransform();
    }
    window.resetView = function () {
        scale = 1;
        ox = 0;
        oy = 0;
        document.getElementById('zoom-val').textContent = '100%';
        applyTransform();
    }

    // initial scale to fit
    const ww = wrap.clientWidth, wh = wrap.clientHeight;
    const fitScale = Math.min(ww / maxX, wh / maxY) * 0.92;
    scale = fitScale;
    ox = (ww - maxX * scale) / 2;
    oy = (wh - maxY * scale) / 2;
    document.getElementById('zoom-val').textContent = Math.round(scale * 100) + '%';
    applyTransform();
</script>
</body>
</html>
