<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <th:block layout:fragment="head-extra">
        <link rel="stylesheet" th:href="@{/css/board/edit.css}">
        <!-- Quill 에디터 스타일 연결 -->
        <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    </th:block>
</head>

<body>
<div layout:fragment="content">
    <div class="wrap">
        <div class="main">

            <div class="hd">
        <span class="hd-title"
              th:text="${boardType == 'notice'} ? '공지사항 수정' :
               (${boardType == 'projectNotice'} ? '프로젝트 공지 수정' : '자유게시판 수정')">게시글 수정
        </span>
            </div>

            <!-- 첨부파일 MultipartFile 전달을 위한 multipart form 설정 -->
            <form class="form-wrap"
                  th:action="@{/board/update}"
                  method="post"
                  enctype="multipart/form-data"
                  id="editForm">

                <input type="hidden" name="postId" th:value="${post.id}">
                <input type="hidden" name="boardId" th:value="${post.boardId}">
                <!-- TokenCheckFilter 미적용 경로에서 수정자 사번을 서버로 전달하기 위한 hidden 값 -->
                <input type="hidden" name="editorNo" id="editorNo">

                <!-- 공지사항 수정 시 상단 고정 여부 설정 영역 -->
                <div class="form-row" th:if="${boardType == 'notice'}">
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 5px 0;">
                        <input type="checkbox" name="pinned" id="pinned"
                               th:checked="${post.pinned}" style="width: 18px; height: 18px;">
                        <span style="font-weight: 600; color: #d32f2f;">최상단에 공지로 고정하기</span>
                    </label>
                </div>

                <!-- 제목 입력 영역 -->
                <div class="form-row">
                    <label for="title">제목</label>
                    <input type="text" id="title" name="title"
                           th:value="${post.title}"
                           placeholder="제목을 입력해주세요" required maxlength="200">
                </div>

                <!-- Quill 본문 편집 영역 -->
                <div class="form-row">
                    <label>내용</label>
                    <div id="quillEditor"></div>
                    <!-- 기존 본문을 보관하고 제출 직전 Quill HTML로 덮어 서버에 전달 -->
                    <input type="hidden" id="content" name="content" th:value="${post.content}">
                </div>

                <!-- 첨부파일 관리 영역 -->
                <div class="attach-section">
                    <label>첨부파일</label>

                    <!-- 기존 첨부파일 반복 및 삭제 예정 상태 표시 처리 -->
                    <div class="existing-files" id="existingFiles"
                         th:if="${post.attachments != null and !post.attachments.isEmpty()}">
                        <div th:each="att : ${post.attachments}"
                             class="file-item"
                             th:id="'existing-' + ${att.id}">

                            <!-- 첨부파일 표시 아이콘 -->
                            <span>📎</span>

                            <!-- 원본 파일명 표시 -->
                            <span class="file-name" th:text="${att.originalName}">파일명.pdf</span>

                            <!-- 파일 크기 KB 변환 표시 -->
                            <span class="file-size"
                                  th:text="${#numbers.formatInteger(att.fileSize / 1024, 0, 'COMMA') + ' KB'}">
                0 KB
              </span>

                            <!-- 삭제 예정 표시 버튼 -->
                            <button type="button" class="file-delete-btn"
                                    th:onclick="'markDelete(' + ${att.id} + ', this)'"
                                    title="삭제">×
                            </button>
                        </div>
                    </div>

                    <!-- 삭제할 첨부파일 ID를 JS가 hidden input으로 추가하는 영역 -->
                    <div id="deleteAttachmentInputs"></div>

                    <!-- 새 첨부파일 업로드 영역 -->
                    <div class="new-file-area">
                        <input type="file" name="attachments" multiple
                               accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip">
                        <span class="new-file-hint">여러 파일 선택 가능</span>
                    </div>
                </div>

                <!-- 수정 취소 및 제출 버튼 영역 -->
                <div class="btn-row">
                    <a th:href="${post.boardId == 1} ? @{/board/notice/{id}(id=${post.id})} :
           (${post.boardId == 2} ? @{/board/general/{id}(id=${post.id})} :
            @{/board/project/notice/{id}(id=${post.id})})"
                       class="btn-cancel">취소</a>
                    <button type="submit" class="btn-submit">수정 완료</button>
                </div>

            </form>
        </div>
    </div>
</div>
<th:block layout:fragment="scripts">
    <!-- edit.js에서 Quill을 사용하므로 먼저 로드 -->
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <script th:src="@{/js/board/edit.js}"></script>
</th:block>
</body>
</html>
