<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <th:block layout:fragment="head-extra">
        <link rel="stylesheet" th:href="@{/css/board/write.css}">
        <!-- Quill CSS -->
        <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    </th:block>
</head>

<body>
<div layout:fragment="content">
    <div class="wrap">
        <div class="main">
            <div class="hd">
                <span class="hd-title"
                      th:text="${boardType == 'notice'} ? '공지사항 작성' :
                               (${boardType == 'projectNotice'} ? '프로젝트 공지 작성' : '자유게시판 작성')">
                    게시글 작성
                </span>
            </div>

            <form class="form-wrap"
                  id="writeForm"
                  enctype="multipart/form-data">

                <!-- boardId hidden: 공지/자유게시판은 서버에서 고정값, 프로젝트 공지는 JS가 드롭다운 선택값으로 채움 -->
                <input type="hidden" name="boardId" id="boardId" th:value="${boardId}">

                <!-- 프로젝트 공지: 프로젝트 선택 드롭다운 -->
                <div class="form-row" th:if="${boardType == 'projectNotice'}">
                    <label for="projectBoardSelect">프로젝트</label>
                    <select id="projectBoardSelect"
                            style="width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:6px; font-size:14px;">
                        <option value="">프로젝트를 선택해주세요</option>
                        <!-- JS loadProjectBoards()가 동적으로 채움 -->
                    </select>
                </div>

                <!-- 공지/프로젝트 공지: 상단 고정 체크박스 -->
                <div class="form-row" th:if="${boardType == 'notice'}">
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 5px 0;">
                        <input type="checkbox" name="pinned" id="pinned" style="width: 18px; height: 18px;">
                        <span style="font-weight: 600; color: #d32f2f;">최상단에 공지로 고정하기</span>
                    </label>
                </div>

                <!-- 제목 -->
                <div class="form-row">
                    <label for="title">제목</label>
                    <input type="text" id="title" name="title"
                           placeholder="제목을 입력해주세요" required maxlength="200">
                </div>

                <!-- 본문: textarea → Quill 에디터 + hidden input -->
                <div class="form-row">
                    <label>내용</label>
                    <!-- Quill 편집 영역 -->
                    <div id="quillEditor"></div>
                    <!-- submit 직전 JS가 Quill HTML을 주입. name="content"으로 서버 전달 -->
                    <input type="hidden" id="content" name="content">
                </div>

                <!-- 첨부파일 -->
                <div class="form-row">
                    <label>첨부파일</label>
                    <div class="file-area">
                        <div class="file-input-row">
                            <button type="button" class="file-btn"
                                    onclick="document.getElementById('fileInput').click()">
                                파일 선택
                            </button>
                            <span class="file-hint">여러 파일을 선택할 수 있습니다.</span>
                        </div>
                        <!-- 실제 파일 input (숨김) -->
                        <input type="file" id="fileInput" name="attachments"
                               multiple style="display:none"
                               onchange="handleFileSelect(this)">
                        <!-- 선택된 파일 목록 -->
                        <div class="file-list" id="fileList"></div>
                    </div>
                </div>

                <!-- 버튼 -->
                <div class="btn-row">
                    <a th:href="${boardType == 'notice'} ? @{/board/notice/list} :
                               (${boardType == 'projectNotice'} ? @{/board/project/notice/list} : @{/board/general/list})"
                       class="btn-cancel">취소</a>
                    <button type="submit" class="btn-submit">등록</button>
                </div>

            </form>
        </div>
    </div>
</div>
</body>

<th:block layout:fragment="scripts">
    <!-- 서버 변수 주입: boardType만 필요 -->
    <script th:inline="javascript">
        const boardType = /*[[${boardType}]]*/ 'general';
    </script>
    <!-- Quill JS (write.js보다 먼저 로드) -->
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <script th:src="@{/js/board/write.js}"></script>
</th:block>
</html>
