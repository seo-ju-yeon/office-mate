<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <th:block layout:fragment="head-extra">
        <script src="https://unpkg.com/lucide@latest"></script>
        <link rel="stylesheet" th:href="@{/css/board/notice_list.css}">
    </th:block>
</head>

<body>
<div layout:fragment="content">
    <div class="wrap">

        <!-- 메인 -->
        <div class="main">
            <div class="hd">
                <span class="hd-title">공지사항</span>
                <button class="wb" onclick="goToNoticeWrite()">+ 글쓰기</button>
            </div>
            <!-- [수정] <div style="flex:1"> 로 테이블 감싸기
                 .main의 justify-content: space-between이 동작하려면
                 테이블 영역과 .bot 영역이 각각 별도 블록이어야 함 -->
            <div style="flex: 1;">
                <table>
                    <thead>
                    <tr>
                        <th style="width:80px; text-align:center">구분</th>
                        <th>제목</th>
                        <th style="width:120px">작성자</th>
                        <th style="width:100px">작성일</th>
                        <th style="width:68px; text-align:right">조회수</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- 데이터 있을 때 -->
                    <th:block th:if="${not #lists.isEmpty(response.dtoList)}">
                        <tr th:each="dto : ${response.dtoList}"
                            onclick="location.href='#'"
                            th:onclick="|location.href='@{/board/notice/{id}(id=${dto.id})}'|">
                            <td style="text-align:center">
                                <span class="lbl lp">공지</span>
                            </td>
                            <td>
                                <div class="ti">
                                    <span class="tt" th:text="${dto.title}"></span>
                                    <!-- 첨부파일 있을 때 클립 아이콘 표시 -->
                                    <span th:if="${dto.attachmentCount > 0}" title="첨부파일 있음"><i data-lucide="paperclip" style="width:14px; height:14px; color:#999;"></i></span>
                                    <!-- 댓글 수가 1개 이상일 때만 [n] 형태로 표시 -->
                                    <span th:if="${dto.commentCount > 0}" class="tc"
                                          th:text="|[${dto.commentCount}]|"></span>
                                </div>
                            </td>
                            <td class="ac" th:text="${dto.authorName}"></td>
                            <td class="mu" th:text="${#temporals.format(dto.postedAt, 'yyyy.MM.dd')}"></td>
                            <td class="nr" th:text="${dto.viewCount}"></td>
                        </tr>
                    </th:block>
                    <!-- 데이터 없을 때 -->
                    <tr th:if="${#lists.isEmpty(response.dtoList)}">
                        <td colspan="5" class="empty">게시글이 없습니다.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="bot">
                <!-- 페이지네이션 -->
                <div class="pgr">
                    <a th:href="@{/board/notice/list(page=${response.start - 1}, size=${response.size}, type=${param.type}, keyword=${param.keyword})}"
                       class="pg"
                       th:classappend="${!response.prev} ? 'disabled'"
                       th:if="${response.prev}">‹</a>

                    <a th:each="num : ${#numbers.sequence(response.start, response.end)}"
                       th:href="@{/board/notice/list(page=${num}, size=${response.size}, type=${param.type}, keyword=${param.keyword})}"
                       class="pg"
                       th:classappend="${response.page == num} ? 'on'"
                       th:text="${num}"></a>

                    <a th:href="@{/board/notice/list(page=${response.end + 1}, size=${response.size}, type=${param.type}, keyword=${param.keyword})}"
                       class="pg"
                       th:if="${response.next}">›</a>
                </div>

                <!-- 검색 -->
                <form th:action="@{/board/notice/list}" method="get">
                    <div class="sr">
                        <select name="type">
                            <option value="t" th:selected="${param.type == 't'}">제목</option>
                            <option value="w" th:selected="${param.type == 'w'}">작성자</option>
                        </select>
                        <input type="text" name="keyword" placeholder="검색어를 입력해주세요"
                               th:value="${param.keyword}"/>
                        <button type="submit">검색</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 권한 없음 모달 -->
    <div id="noAuthModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:#fff; border-radius:12px; padding:32px 36px; text-align:center; min-width:280px; box-shadow:0 8px 32px rgba(0,0,0,0.15);">
            <div style="font-size:16px; font-weight:700; color:#1a1a1a; margin-bottom:8px;">접근 권한 없음</div>
            <div style="font-size:14px; color:#888; margin-bottom:24px;">공지사항 작성은 관리자만 가능합니다.</div>
            <button onclick="document.getElementById('noAuthModal').style.display='none'"
                    style="padding:9px 28px; background:#1976D2; color:#fff; border:none; border-radius:7px; font-size:14px; font-weight:600; cursor:pointer;">
                확인
            </button>
        </div>
    </div>
</div>

</body>
<th:block layout:fragment="scripts">
    <script th:src="@{/js/board/notice_list.js}"></script>
    <!-- 권한 없이 리다이렉트 됐을 때 모달 자동 표시 -->
    <script th:if="${noAuth}">
        document.getElementById('noAuthModal').style.display = 'flex';
    </script>
</th:block>
</html>
