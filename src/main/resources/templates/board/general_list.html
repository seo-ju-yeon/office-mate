<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <th:block layout:fragment="head-extra">
        <script src="https://unpkg.com/lucide@latest"></script>
        <link rel="stylesheet" th:href="@{/css/board/general_list.css}">
    </th:block>
</head>

<body>
<div layout:fragment="content">
    <div class="wrap">

        <!-- 자유게시판 목록 영역 -->
        <div class="main">
            <div class="hd">
                <span class="hd-title">자유게시판</span>
                <button class="wb" th:onclick="|location.href='@{/board/general/write}'|">+ 글쓰기</button>
            </div>
            <!-- 테이블과 하단 영역을 분리해 .main의 space-between 레이아웃 유지 처리 -->
            <div style="flex: 1;">
                <table>
                    <thead>
                    <tr>
                        <!-- 자유게시판 배지 텍스트 잘림 방지를 위한 구분 열 너비 유지 -->
                        <th style="width:100px; text-align:center">구분</th>
                        <th>제목</th>
                        <th style="width:120px">작성자</th>
                        <th style="width:100px">작성일</th>
                        <th style="width:68px; text-align:right">조회수</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- 게시글 목록 렌더링 반복 -->
                    <th:block th:if="${not #lists.isEmpty(response.dtoList)}">
                        <tr th:each="dto : ${response.dtoList}"
                            onclick="location.href='#'"
                            th:onclick="|location.href='@{/board/general/{id}(id=${dto.id})}'|">
                            <td style="text-align:center">
                                <span th:if="${dto.pinned}" class="lbl lp">공지</span>
                                <!-- 자유게시판 배지 텍스트와 스타일 표시 처리 -->
                                <span th:unless="${dto.pinned}" class="lbl l-free">자유게시판</span>
                            </td>
                            <td>
                                <div class="ti">
                                    <span class="tt" th:text="${dto.title}"></span>
                                    <span th:if="${dto.attachmentCount > 0}" title="첨부파일 있음"><i data-lucide="paperclip"
                                                                                                style="width:14px; height:14px; color:#999;"></i></span>
                                    <span th:if="${dto.commentCount > 0}" class="tc"
                                          th:text="|[${dto.commentCount}]|"></span>
                                </div>
                            </td>
                            <td class="ac" th:text="${dto.authorName}"></td>
                            <td class="mu" th:text="${#temporals.format(dto.postedAt, 'yyyy.MM.dd')}"></td>
                            <td class="nr" th:text="${dto.viewCount}"></td>
                        </tr>
                    </th:block>
                    <!-- 게시글 없음 표시 영역 -->
                    <tr th:if="${#lists.isEmpty(response.dtoList)}">
                        <td colspan="5" class="empty">게시글이 없습니다.</td>
                    </tr>
                    </tbody>
                </table>
            </div>


            <div class="bot">
                <!-- 자유게시판 페이지 이동 영역 -->
                <div class="pgr">
                    <a th:href="@{/board/general/list(page=${response.start - 1}, size=${response.size}, type=${param.type}, keyword=${param.keyword})}"
                       class="pg"
                       th:classappend="${!response.prev} ? 'disabled'"
                       th:if="${response.prev}">‹</a>

                    <a th:each="num : ${#numbers.sequence(response.start, response.end)}"
                       th:href="@{/board/general/list(page=${num}, size=${response.size}, type=${param.type}, keyword=${param.keyword})}"
                       class="pg"
                       th:classappend="${response.page == num} ? 'on'"
                       th:text="${num}"></a>

                    <a th:href="@{/board/general/list(page=${response.end + 1}, size=${response.size}, type=${param.type}, keyword=${param.keyword})}"
                       class="pg"
                       th:if="${response.next}">›</a>
                </div>

                <!-- 검색 조건 유지용 GET 검색 영역 -->
                <form th:action="@{/board/general/list}" method="get">
                    <div class="sr">
                        <select name="type">
                            <option value="t" th:selected="${param.type == 't'}">제목</option>
                            <option value="w" th:selected="${param.type == 'w'}">작성자</option>
                        </select>
                        <input type="text" name="keyword" placeholder="검색어를 입력해주세요"
                               th:value="${param.keyword}"/>
                        <button type="submit">검색</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/board/general_list.js}"></script>
</th:block>
</html>
