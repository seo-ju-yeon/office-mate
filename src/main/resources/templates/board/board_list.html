<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <th:block layout:fragment="head-extra">
        <script src="https://unpkg.com/lucide@latest"></script>
        <link rel="stylesheet" th:href="@{/css/board/board_list.css}">
    </th:block>
</head>

<body>
<div layout:fragment="content">
    <div class="wrap">

        <!-- 메인 -->
        <div class="main">
            <div class="hd">
                <span class="hd-title">전체 게시판</span>
            </div>
            <!-- [수정] <div style="flex:1"> 로 테이블 감싸기 — .main의 justify-content: space-between이 동작하려면
                 테이블 영역과 .bot 영역이 각각 별도 블록이어야 함 -->
            <div style="flex: 1;">
                <table>
                    <thead>
                    <tr>
                        <th style="width:100px; text-align:center">게시판</th>
                        <th style="text-align:center">제목</th>
                        <th style="width:120px; text-align:center">작성자</th>
                        <th style="width:100px; text-align:center">작성일</th>
                        <th style="width:68px; text-align:right">조회수</th>
                    </tr>
                    </thead>
                    <tbody>
                    <th:block th:each="dto : ${response.dtoList}">
                        <!-- 공지 고정글: is_pinned=true인 게시글만 상단에 별도 렌더링 -->
                        <tr th:if="${dto.pinned}" class="notice-row"
                            th:onclick="|location.href='@{/board/notice/{id}(id=${dto.id})}'|">
                            <td style="text-align:center">
                                <span class="lbl lp">공지</span>
                            </td>
                            <td>
                                <div class="ti">
                                    <span class="tt" style="font-weight: 700;" th:text="${dto.title}"></span>
                                    <span th:if="${dto.attachmentCount > 0}"><i data-lucide="paperclip" style="width:14px; height:14px; color:#999;"></i></span>
                                    <!-- 댓글 수가 1개 이상일 때만 [n] 형태로 표시 -->
                                    <span th:if="${dto.commentCount > 0}" class="tc"
                                          th:text="|[${dto.commentCount}]|"></span>
                                </div>
                            </td>
                            <td class="ac" th:text="${dto.authorName}"></td>
                            <td class="mu" th:text="${#temporals.format(dto.postedAt, 'yyyy.MM.dd')}"></td>
                            <td class="nr" th:text="${dto.viewCount}"></td>
                        </tr>
                    </th:block>

                    <th:block th:each="dto : ${response.dtoList}">
                        <!-- 일반글: is_pinned=false인 게시글 렌더링
                             board_id=1(공지사항)이면 /notice/{id}, 그 외이면 /general/{id}로 이동 -->
                        <tr th:if="${!dto.pinned}" class="general-row"
                            th:onclick="${dto.boardId == 1}
                        ? |location.href='@{/board/notice/{id}(id=${dto.id})}'|
                        : |location.href='@{/board/general/{id}(id=${dto.id})}'|">
                            <td style="text-align:center">
                                <!-- [수정] board_id=1이면 lf(회색), 그 외이면 l-free(파란색) 배지 적용
                                     boardName을 배지 텍스트로 동적 표시 -->
                                <span class="lbl"
                                      th:classappend="${dto.boardId == 1} ? 'lf' : 'l-free'"
                                      th:text="${dto.boardName}"></span>
                            </td>
                            <td>
                                <div class="ti">
                                    <span class="tt" th:text="${dto.title}"></span>
                                    <span th:if="${dto.attachmentCount > 0}"><i data-lucide="paperclip" style="width:14px; height:14px; color:#999;"></i></span>
                                    <!-- 댓글 수가 1개 이상일 때만 [n] 형태로 표시 -->
                                    <span th:if="${dto.commentCount > 0}" class="tc"
                                          th:text="|[${dto.commentCount}]|"></span>
                                </div>
                            </td>
                            <td class="ac" th:text="${dto.authorName}"></td>
                            <td class="mu" th:text="${#temporals.format(dto.postedAt, 'yyyy.MM.dd')}"></td>
                            <td class="nr" th:text="${dto.viewCount}"></td>
                        </tr>
                    </th:block>
                    </tbody>
                </table>
            </div>

            <div class="bot">
                <!-- 페이지네이션: 자유게시판 기준으로만 페이징 -->
                <div class="pgr">
                    <a th:href="@{/board/list(page=${response.start - 1}, size=${response.size}, type=${param.type}, keyword=${param.keyword})}"
                       class="pg"
                       th:if="${response.prev}">‹</a>

                    <a th:each="num : ${#numbers.sequence(response.start, response.end)}"
                       th:href="@{/board/list(page=${num}, size=${response.size}, type=${param.type}, keyword=${param.keyword})}"
                       class="pg"
                       th:classappend="${response.page == num} ? 'on'"
                       th:text="${num}"></a>

                    <a th:href="@{/board/list(page=${response.end + 1}, size=${response.size}, type=${param.type}, keyword=${param.keyword})}"
                       class="pg"
                       th:if="${response.next}">›</a>
                </div>

                <form th:action="@{/board/list}" method="get">
                    <div class="sr">
                        <select name="type">
                            <option value="t" th:selected="${param.type == 't'}">제목</option>
                            <option value="w" th:selected="${param.type == 'w'}">작성자</option>
                        </select>
                        <input type="text" name="keyword" placeholder="검색어를 입력해주세요"
                               th:value="${param.keyword}"/>
                        <button type="submit">검색</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
<th:block layout:fragment="scripts">
    <script th:src="@{/js/board/board_list.js}"></script>
</th:block>
</html>
