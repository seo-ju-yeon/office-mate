<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>OfficeMate - Engineering Excellence</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-black: #000000;
      --grid-color: rgba(255, 255, 255, 0.05);
      --accent-blue: #007AFF; /* Apple Blue */
      --text-dim: #86868b;
    }

    body, html {
      margin: 0; padding: 0; height: 100%;
      background-color: var(--bg-black);
      font-family: 'Noto Sans KR', sans-serif;
      overflow: hidden;
      color: white;
    }

    /* 1. 엔지니어링 그리드 배경 */
    .grid-background {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image:
              linear-gradient(var(--grid-color) 1px, transparent 1px),
              linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 1;
    }

    /* 2. 마우스 스포트라이트 효과 */
    .spotlight {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle 400px at var(--x) var(--y), rgba(0, 122, 255, 0.15), transparent 80%);
      z-index: 2;
      pointer-events: none;
    }

    .content-wrapper {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 10%; /* 왼쪽 정렬로 구도 변경 (세련미) */
    }

    .status-pill {
      display: inline-block;
      padding: 5px 12px;
      background: rgba(0, 122, 255, 0.1);
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      margin-bottom: 20px;
      width: fit-content;
      text-transform: uppercase;
    }

    .main-title {
      font-size: 5rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: -3px;
    }

    .main-title span {
      color: var(--text-dim);
      font-weight: 300;
    }

    .description {
      font-size: 1.2rem;
      color: var(--text-dim);
      max-width: 600px;
      line-height: 1.6;
      margin: 20px 0 40px 0;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 15px;
      text-decoration: none;
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      transition: 0.3s;
    }

    .nav-btn:hover {
      color: var(--accent-blue);
      transform: translateX(10px);
    }

    .nav-btn .arrow {
      width: 40px;
      height: 1px;
      background: white;
      position: relative;
      transition: 0.3s;
    }

    .nav-btn:hover .arrow {
      background: var(--accent-blue);
      width: 60px;
    }

    /* 하단 카운터 (사이언틱 요소) */
    .metrics {
      position: absolute;
      bottom: 50px;
      left: 10%;
      display: flex;
      gap: 50px;
      font-family: 'JetBrains Mono', monospace;
    }

    .metric-item span {
      display: block;
      font-size: 10px;
      color: var(--text-dim);
      margin-bottom: 5px;
    }

    .metric-item b {
      font-size: 18px;
      color: white;
    }
  </style>
</head>
<body>

<div class="grid-background"></div>
<div class="spotlight" id="spotlight"></div>

<div class="content-wrapper">
  <div class="status-pill">System Status: Operational</div>
  <h1 class="main-title">Office<span>Mate.</span></h1>
  <p class="description">
    데이터 무결성과 보안을 최우선으로 하는<br>
    차세대 사내 통합 관리 솔루션입니다.
  </p>

  <a href="/login" class="nav-btn" id="entry-link">
    <div class="arrow"></div>
    <span>GO TO DASHBOARD</span>
  </a>
</div>

<div class="metrics">
<!--  <div class="metric-item"><span>ENCRYPTION</span><b>AES-256</b></div>-->
  <div class="metric-item"><span>TEAM</span><b>서주연, 강수현, 박재경, 서민성</b></div>
  <div class="metric-item"><span>DATABASE</span><b>PGVECTOR</b></div>
  <div class="metric-item"><span>SESSION</span><b>JWT-REDIS</b></div>
</div>

<script>
  const spotlight = document.getElementById('spotlight');

  // 마우스 스포트라이트 이동 로직
  window.addEventListener('mousemove', e => {
    spotlight.style.setProperty('--x', e.clientX + 'px');
    spotlight.style.setProperty('--y', e.clientY + 'px');
  });

  // 세션 체크
  const token = localStorage.getItem('accessToken');
  if (token) {
    document.querySelector('#entry-link span').innerText = "GO TO DASHBOARD";
    document.getElementById('entry-link').href = "/dashboard";
  }
</script>
</body>
</html>
