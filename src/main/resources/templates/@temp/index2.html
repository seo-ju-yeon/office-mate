<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>OfficeMate - 스마트 협업 플랫폼</title>
  <!-- 구글 폰트 및 스타일링 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-blue: #0052CC;
      --dark-navy: #071424;
      --soft-blue: #DEEBFF;
    }

    body, html {
      margin: 0; padding: 0; height: 100%;
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--dark-navy);
      overflow: hidden; /* 배경 애니메이션을 위해 스크롤 방지 */
    }

    /* 메인 컨테이너 */
    .hero-wrapper {
      position: relative;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      z-index: 1;
    }

    /* 텍스트 애니메이션 섹션 */
    .brand-box {
      text-align: center;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 1.2s ease forwards;
    }

    .brand-name {
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: -2px;
      margin: 0;
      background: linear-gradient(to right, #ffffff, var(--soft-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sub-title {
      font-size: 1.2rem;
      letter-spacing: 4px;
      color: #8993A4;
      margin-top: 10px;
      text-transform: uppercase;
    }

    /* 터치/클릭 안내 (동적 깜빡임) */
    .entry-action {
      margin-top: 50px;
      cursor: pointer;
      text-decoration: none;
      color: white;
      transition: 0.3s;
      z-index: 10;
    }

    .touch-info {
      font-size: 1rem;
      font-weight: 300;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 12px 30px;
      border-radius: 50px;
      animation: pulse 2s infinite;
    }

    /* 하단 파도 애니메이션 (사용자 소스 기반 디벨롭) */
    .waves {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 15vh;
      min-height: 100px;
      max-height: 150px;
    }

    .parallax > use {
      animation: move-forever 25s cubic-bezier(.55,.5,.45,.5) infinite;
    }
    .parallax > use:nth-child(1) { animation-delay: -2s; animation-duration: 7s; fill: rgba(0, 82, 204, 0.7); }
    .parallax > use:nth-child(2) { animation-delay: -3s; animation-duration: 10s; fill: rgba(0, 82, 204, 0.5); }
    .parallax > use:nth-child(3) { animation-delay: -4s; animation-duration: 13s; fill: rgba(0, 82, 204, 0.3); }
    .parallax > use:nth-child(4) { animation-delay: -5s; animation-duration: 20s; fill: #F4F5F7; }

    /* 애니메이션 Keyframes */
    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; border-color: var(--primary-blue); box-shadow: 0 0 15px rgba(0, 82, 204, 0.5); }
      100% { transform: scale(1); opacity: 0.8; }
    }

    @keyframes move-forever {
      0% { transform: translate3d(-90px,0,0); }
      100% { transform: translate3d(85px,0,0); }
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .brand-name { font-size: 2.5rem; }
      .waves { height: 40px; min-height: 40px; }
    }
  </style>
</head>
<body>

<div class="hero-wrapper" id="app">
  <div class="brand-box">
    <h1 class="brand-name">OfficeMate</h1>
    <p class="sub-title">Smart Enterprise Solution</p>
  </div>

  <!-- 세션 여부에 따라 동적으로 메시지 변경 가능 -->
  <a href="/login" class="entry-action" id="main-action">
    <p class="touch-info" id="action-text">GET STARTED</p>
  </a>

  <!-- 파도 SVG 애니메이션 -->
  <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
       viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
    <defs>
      <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
    </defs>
    <g class="parallax">
      <use xlink:href="#gentle-wave" x="48" y="0" />
      <use xlink:href="#gentle-wave" x="48" y="3" />
      <use xlink:href="#gentle-wave" x="48" y="5" />
      <use xlink:href="#gentle-wave" x="48" y="7" />
    </g>
  </svg>
</div>

<script th:inline="javascript">
  // 서버로부터 사번이나 상태값을 받아 동적 제어
  const USER_ID = /*[[${userId}]]*/ null;

  document.addEventListener('DOMContentLoaded', () => {
    const actionText = document.getElementById('action-text');
    const mainAction = document.getElementById('main-action');
    const token = localStorage.getItem('accessToken');

    if (token || USER_ID) {
      // 이미 로그인 상태일 때
      actionText.innerText = "GO TO DASHBOARD";
      mainAction.href = "/dashboard";
    } else {
      // 미인증 상태일 때
      actionText.innerText = "SIGN IN TO START";
      mainAction.href = "/login";
    }

    // 클릭 효과 ( ripples )
    document.body.addEventListener('click', (e) => {
      if(e.target.closest('.entry-action')) return;
      // 여기서 화면 전환 효과 등을 추가할 수 있음
    });
  });
</script>

</body>
</html>
