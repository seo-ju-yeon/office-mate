<!DOCTYPE html>
<html lang="ko">
<head>
    <!--
    설계 전략
    1. 세션 상태 자동 감지: JS로 localStorage의 JWT 유효성을 즉시 체크하여, 이미 로그인된 사용자는 로그인 폼 대신 "대시보드로 바로가기" 버튼을 보여줌
    2. 사번 찾기, 비밀번호 찾기, 시스템 메뉴얼 다운로드 등 자주 묻는 질문(FAQ) 링크를 배치
    -->
    <meta charset="UTF-8">
    <title>OfficeMate - 스마트 협업 플랫폼</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0052CC; --dark-navy: #091E42; --bg-gray: #F4F5F7;
        }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Noto Sans KR', sans-serif; background: var(--bg-gray); }

        /* 히어로 섹션 */
        .landing-wrapper {
            display: flex; height: 100vh; flex-direction: column;
            background: linear-gradient(135deg, var(--dark-navy) 0%, #002147 100%);
            color: white; overflow: hidden; position: relative;
        }

        /* 배경 장식 요소 */
        .landing-wrapper::before {
            content: ""; position: absolute; top: -10%; right: -10%; width: 50%; height: 60%;
            background: rgba(0, 82, 204, 0.1); border-radius: 50%; filter: blur(80px);
        }

        header {
            padding: 30px 60px; display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }
        .logo { font-size: 24px; font-weight: 700; letter-spacing: -1px; }

        .main-content {
            flex: 1; display: flex; align-items: center; justify-content: center;
            flex-direction: column; text-align: center; z-index: 10; padding: 0 20px;
        }
        h1 { font-size: 48px; margin-bottom: 10px; font-weight: 700; }
        p.subtitle { font-size: 18px; color: #B3BAC5; margin-bottom: 40px; }

        .action-cards { display: flex; gap: 20px; }
        .card {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px; border-radius: 12px; width: 280px; transition: 0.3s;
            backdrop-filter: blur(10px); cursor: pointer; text-decoration: none; color: white;
        }
        .card:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-10px); border-color: var(--primary-blue); }
        .card h3 { font-size: 20px; margin: 15px 0; }
        .card p { font-size: 14px; color: #B3BAC5; line-height: 1.5; }
        .icon { font-size: 40px; }

        /* 하단 유틸리티 */
        footer {
            padding: 40px 60px; background: rgba(0,0,0,0.2); display: flex;
            justify-content: space-between; font-size: 13px; color: #6B778C;
        }
        .footer-links a { color: #A5ADBA; text-decoration: none; margin-left: 20px; }
        .footer-links a:hover { color: white; }

        /* 상태에 따른 버튼 제어 (JS) */
        #go-dashboard { display: none; background: var(--primary-blue); color: white; padding: 15px 40px; border-radius: 4px; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>

<div class="landing-wrapper">
    <header>
        <div class="logo">🟦 OfficeMate</div>
        <div id="auth-status">
            <a href="login.html" id="login-link" style="color: white; text-decoration: none; font-weight: 500;">로그인</a>
        </div>
    </header>

    <div class="main-content">
        <h1>더 나은 협업의 시작</h1>
        <p class="subtitle">사내 사무 지원 및 효율적인 부서 간 소통을 위한 통합 플랫폼</p>

        <!-- 로그인 전 사용자에게 보임 -->
        <div class="action-cards" id="guest-actions">
            <a href="login.html" class="card">
                <div class="icon">🔑</div>
                <h3>시스템 접속</h3>
                <p>사번과 비밀번호를 사용하여<br>안전하게 로그인하세요.</p>
            </a>
            <a href="password-find.html" class="card">
                <div class="icon">✉️</div>
                <h3>계정 찾기</h3>
                <p>비밀번호를 잊으셨나요?<br>이메일 인증으로 재설정하세요.</p>
            </a>
            <a href="#" class="card">
                <div class="icon">📖</div>
                <h3>이용 가이드</h3>
                <p>신규 입사자를 위한<br>플랫폼 매뉴얼을 확인하세요.</p>
            </a>
        </div>

        <!-- 로그인 후 사용자에게 보임 -->
        <a href="dashboard.html" id="go-dashboard">대시보드로 바로가기</a>
    </div>

    <footer>
        <div>© 2026 OfficeMate System. All Rights Reserved.</div>
        <div class="footer-links">
            <a href="#">개인정보처리방침</a>
            <a href="#">보안 정책</a>
            <a href="#">기술 지원</a>
        </div>
    </footer>
</div>

<script>
    // 초기 진입 시 세션 체크 (JWT 존재 여부)
    document.addEventListener('DOMContentLoaded', function() {
        const token = localStorage.getItem('accessToken');
        const guestActions = document.getElementById('guest-actions');
        const dashboardBtn = document.getElementById('go-dashboard');
        const loginLink = document.getElementById('login-link');

        if (token) {
            // 이미 로그인된 경우 UI 변경
            guestActions.style.display = 'none';
            dashboardBtn.style.display = 'inline-block';
            loginLink.innerText = '로그아웃';
            loginLink.href = '#';
            loginLink.onclick = function() {
                localStorage.removeItem('accessToken');
                location.reload();
            };
        }
    });
</script>
</body>
</html>
