<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>OfficeMate - 비밀번호 찾기</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login/password-find.css}">
</head>
<body>
<!-- 비밀번호 찾기 단계를 표시하는 전체 카드 영역 -->
<div class="find-container">
    <!-- 사번과 이메일을 입력해 임시 비밀번호 발송을 요청하는 단계 -->
    <div id="step1" class="step active">
        <h2>비밀번호 찾기</h2>
        <p>등록된 사번과 이메일 주소를 입력하시면<br>임시 비밀번호를 메일로 발송해 드립니다.</p>
        <div class="form-group">
            <label>사번</label>
            <input type="text" id="find-employee-no" placeholder="예: MS001">
        </div>
        <div class="form-group">
            <label>이메일</label>
            <input type="email" id="find-email" placeholder="example@company.com">
        </div>
        <button class="btn-primary" onclick="requestPasswordReset()" data-action="CREATE"
                data-resource="PASSWORD_RESET">임시 비밀번호 발송
        </button>
        <button class="btn-link" onclick="location.href='/login'">로그인으로 돌아가기</button>
    </div>

    <!-- 임시 비밀번호 메일 발송 완료 후 다음 행동을 안내하는 단계 -->
    <div id="step2" class="step">
        <h2>메일 발송 완료</h2>
        <p><strong id="target-email"></strong>(으)로<br>임시 비밀번호와 재설정 링크를 발송했습니다.</p>
        <p>메일의 임시 비밀번호는 10분 동안만 유효합니다.</p>
        <button class="btn-primary" onclick="location.href='/password-reset'" data-action="UPDATE"
                data-resource="PASSWORD">
            비밀번호 재설정하러 가기
        </button>
        <button class="btn-link" onclick="location.href='/password-find'">임시 비밀번호 다시 받기</button>
    </div>
</div>

<script th:src="@{/js/login/password-find.js}"></script>
</body>
</html>
