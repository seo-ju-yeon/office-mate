<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OfficeMate - 로그인</title>
    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"/>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" th:href="@{/css/login/login.css}">
</head>
<body>

<!-- 로그인 요청 로딩 오버레이 영역 -->
<div id="loading-overlay">
    <div class="spinner"></div>
</div>

<!-- 로그인 및 복직 신청 본문 영역 -->
<div class="login-container">
    <!-- 서비스 로고 영역 -->
    <div class="logo">
        <i data-lucide="layout-dashboard"></i>
        <span>OfficeMate</span>
    </div>

    <!-- 로그인/복직 신청 오류 메시지 영역 -->
    <div id="error-msg" class="error-area">
        <i data-lucide="alert-circle" class="message-icon"></i>
        <span id="error-text">사번 또는 비밀번호가 올바르지 않습니다.</span>
    </div>

    <!-- 복직 신청 성공 메시지 영역 -->
    <div id="success-msg" class="success-area">
        <i data-lucide="check-circle" class="message-icon"></i>
        <span id="success-text">요청이 완료되었습니다.</span>
    </div>

    <!-- 로그인 입력 폼 영역 -->
    <form id="loginForm">
        <div class="form-group">
            <label for="employeeId">사번</label>
            <div class="input-wrapper">
                <input type="text" id="employeeId" name="username" placeholder="사번을 입력하세요" required>
            </div>
            <!-- 사번 대문자 자동 전환 안내 영역 -->
            <div class="input-hint">
                <i data-lucide="info" class="hint-icon"></i>
                <span>사번은 자동으로 대문자로 전환되어 입력됩니다.</span>
            </div>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <div class="input-wrapper">
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
                <button type="button" class="password-toggle" onclick="togglePassword()" id="toggleBtn">
                    <i data-lucide="eye" id="toggleIcon"></i>
                </button>
            </div>
            <!-- 비밀번호 대소문자 구분 안내 영역 -->
            <div class="input-hint">
                <i data-lucide="info" class="hint-icon"></i>
                <span>비밀번호는 대소문자를 구분합니다.</span>
            </div>
        </div>

        <button type="submit" class="btn-primary">
            <span>로그인</span>
        </button>
    </form>

    <!-- 휴직 계정 복직 신청 영역 -->
    <section id="return-request-panel" class="return-request-panel">
        <p class="return-request-title">
            <i data-lucide="clipboard-check" class="message-icon"></i>
            복직 신청
        </p>
        <p class="return-request-description">
            휴직 상태에서는 업무 화면으로 로그인할 수 없습니다. <br>
            복직 사유를 작성하면 SUPER 승인자가 확인 후 재직 상태로 변경할 수 있습니다.
        </p>
        <div class="form-group">
            <label for="return-reason">복직 신청 사유</label>
            <textarea id="return-reason" maxlength="2000"
                      placeholder="복직을 희망하는 사유를 작성해주세요."></textarea>
        </div>
        <button type="button" class="btn-primary" id="return-request-btn" onclick="submitReturnFromLeaveRequest()">
            <span>복직 신청 제출</span>
        </button>
    </section>

    <!-- 비밀번호 찾기 이동 링크 영역 -->
    <div class="info-area">
        <p><a href="/password-find">비밀번호를 잊으셨나요?</a></p>
    </div>
</div>

<script th:src="@{/js/login/login.js}"></script>
</body>
</html>
