# ----- Project Name -----
spring.application.name=office_mate_2605
# ----- database Connection (PgVector) -----
spring.datasource.pgvector.url=jdbc:postgresql://localhost:5432/office_mate_2605?stringtype=unspecified
spring.datasource.pgvector.username=${DB_USERNAME}
spring.datasource.pgvector.password=${DB_PASSWORD}
spring.datasource.pgvector.driver-class-name=org.postgresql.Driver
# ----- Audit Log Database -----
spring.datasource.audit.url=jdbc:postgresql://localhost:5432/office_mate_audit_log
spring.datasource.audit.username=${AUDIT_DB_USERNAME}
spring.datasource.audit.password=${AUDIT_DB_PASSWORD}
spring.datasource.audit.driver-class-name=org.postgresql.Driver
# ----- Log4j2 logging Levels -----
logging.level.org.springframework=info
logging.level.org.example.board_cafe_kiosk_2603=debug
# ----- Console log pattern -----
logging.level.org.mybatis=debug
logging.level.java.sql=debug
# logging pattern
logging.pattern.console=%clr(%-5level){green} %clr(%logger{36}.%M\\(\\)){cyan}: %msg%n
# ----- MyBatis Configuration (Location of Mapper XML files) -----
# mybatis
mybatis.mapper-locations=classpath:mapper/**/*.xml
# ----- Convert snake_case (DB) to camelCase (Java) -----
mybatis.configuration.map-underscore-to-camel-case=true
# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
# ----- [Windows] File Upload Settings -----
#spring.servlet.multipart.enabled=true
#spring.servlet.multipart.location=c:\\upload
#spring.servlet.multipart.max-request-size=30MB
#spring.servlet.multipart.max-file-size=10MB
#my.upload.path=c:\\upload
# ----- [MacOS] File Upload Settings -----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=${UPLOAD_PATH}
spring.servlet.multipart.max-request-size=30MB
spring.servlet.multipart.max-file-size=10MB
my.upload.path=${UPLOAD_PATH}
# ----- spring security logging config -----
#logging.level.org.springframework.security=info
# ----- Spring Boot Standard Mail Settings -----
spring.mail.host=smtp.naver.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
# ----- SMTP Additional Properties -----
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
myapp.custom.mail.sender.mailFrom=${MAIL_FROM:${MAIL_USERNAME}}
myapp.custom.mail.sender.mailFromName=OFFICE_MATE
# ----- spring Batch -----
# spring Batch Table Auto Create
spring.batch.jdbc.initialize-schema=always
# Prevent Spring Batch from executing jobs automatically on startup
spring.batch.job.enabled=false
# ----- Audit Log Flush (1minute=60000)-----
audit-log.flush.fixed-delay-ms=300000
# ----- Redis -----
spring.data.redis.host=localhost
spring.data.redis.port=6379
# ----- JWTUtil (token secret key) -----
my.jwt.secret=${JWT_SECRET}

# ----- google calender -----
spring.application.calender.name=credentials

# ----- AI Chat -----
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.chat.options.model=gpt-4o-mini
spring.ai.chat.options.temperature=0.7
spring.ai.embedding.options.model=text-embedding-3-small

# session time out 12h
server.servlet.session.timeout=12h
# cookie time out 12h
server.servlet.session.cookie.max-age=43200

# ----- .env environment variables -----
spring.config.import=optional:file:.env[.properties]
